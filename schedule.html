<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>유통지원팀 일정표</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.css" />
<style>
  /* 1번 대시보드(유통지원_할일_대시보드)와 같은 디자인 토큰 */
  :root{
    --bg:#ffffff; --panel:#ffffff; --text:#14161f; --sub:#646b7a; --border:#d3d7e3;
    --blue:#243e8f; --blue-bg:#eaeef9; --orange:#a45414; --orange-bg:#f8ede0;
    --amber:#96690a; --amber-bg:#f7eede;
    --hover:#eef0f6; --shadow: 0 1px 2px rgba(15,23,42,.09), 0 8px 22px rgba(15,23,42,.12);
    --navy-from:#0b1120; --navy-to:#1b2647; --gold:#c9a24b; --gold-bg:#f8f0dc;
    --today-bg:#1b2647; --today-fg:#ffffff;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0d0f16; --panel:#161a26; --text:#eef0f6; --sub:#9aa1b3; --border:#262b3b;
      --blue:#7d9cf2; --blue-bg:#1b2742; --orange:#e2a568; --orange-bg:#332212;
      --amber:#e3bd6b; --amber-bg:#332811;
      --hover:#1e2333; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
      --navy-from:#05070d; --navy-to:#141c33; --gold:#d9bb72; --gold-bg:#332811;
      --today-bg:#d9bb72; --today-fg:#1b1400;
    }
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text); min-height:100vh; line-height:1.5;
    font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,sans-serif;
  }
  header.top{
    display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap;
    background:linear-gradient(135deg, var(--navy-from), var(--navy-to));
    padding:26px max(20px, calc((100vw - 1100px)/2 + 20px)) 22px; margin-bottom:22px;
  }
  header.top h1{font-size:21px; margin:0 0 5px; letter-spacing:-.2px; font-weight:800; color:#fdfdff;}
  header.top p{margin:0; color:rgba(255,255,255,.58); font-size:13px; letter-spacing:.1px;}
  .sync-box{display:flex; align-items:center; gap:8px; font-size:12px; color:rgba(255,255,255,.8); background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.14); border-radius:20px; padding:6px 8px 6px 12px; backdrop-filter:blur(6px);}
  .sync-dot{width:7px; height:7px; border-radius:50%; background:var(--gold); flex-shrink:0;}
  .sync-dot.flash{animation:pulse .9s ease;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(201,162,75,.55);}70%{box-shadow:0 0 0 8px rgba(201,162,75,0);}100%{box-shadow:0 0 0 0 rgba(201,162,75,0);}}
  .sync-box button{border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.06); color:#fff; cursor:pointer; font-size:12px; font-weight:600; padding:5px 11px; border-radius:20px; font-family:inherit; transition:background .12s;}
  .sync-box button:hover{background:rgba(255,255,255,.18);}

  .wrap{max-width:1100px; margin:0 auto; padding:0 20px 60px;}
  .toolbar{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:14px;}
  .nav{display:flex; align-items:center; gap:8px;}
  .nav button{
    background:var(--panel); border:1px solid var(--border); color:var(--text);
    border-radius:20px; padding:6px 14px; cursor:pointer; font-size:13px; font-weight:600; font-family:inherit;
    transition:background .12s, border-color .12s;
  }
  .nav button:hover{background:var(--hover); border-color:var(--blue);}
  .nav .ym{font-size:19px; font-weight:800; min-width:128px; text-align:center; letter-spacing:-.2px;}
  .legend{display:flex; gap:14px; align-items:center; font-size:12px; color:var(--sub); font-weight:600;}
  .dot{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px;}
  .dot.ext{background:var(--orange);}
  .dot.int{background:var(--blue);}
  .dot.holiday{background:var(--amber);}

  .cal-card{
    background:var(--panel); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow);
    overflow:hidden; position:relative;
  }
  .cal-card::before{content:""; position:absolute; top:0; left:18px; right:18px; height:2px; border-radius:0 0 3px 3px; background:var(--blue); opacity:.85; z-index:1;}
  .grid{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:1px; background:var(--border);}
  .dow{background:var(--hover); text-align:center; font-size:12px; color:var(--sub); padding:9px 0 7px; font-weight:700; letter-spacing:.3px;}
  .cell{
    background:var(--panel); min-height:118px; padding:7px 7px 8px; display:flex; flex-direction:column; gap:3px;
    box-sizing:border-box; min-width:0; transition:background .12s;
  }
  .cell:hover{background:var(--hover);}
  .cell.pad{background:var(--hover); opacity:.55;}
  .cell.pad:hover{background:var(--hover);}
  .cell.today{box-shadow:inset 0 0 0 2px var(--gold);}
  .cell.holiday{background:var(--amber-bg);}
  .holiday-name{color:var(--amber); font-weight:700; font-size:11px; margin-left:4px;}
  .daynum{font-size:12px; color:var(--sub); font-weight:700; margin-bottom:2px; flex:none; display:flex; align-items:center; min-height:20px;}
  .cell.today .daynum span.n{background:var(--today-bg); color:var(--today-fg); border-radius:11px; min-width:22px; height:22px; padding:0 6px; display:inline-flex; align-items:center; justify-content:center;}
  .chip{
    font-size:11px; line-height:1.35; padding:2px 6px; border-radius:5px; cursor:default; border-left:3px solid transparent;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:none; font-weight:600;
  }
  .chip .tm{font-weight:800; margin-right:2px; font-variant-numeric:tabular-nums;}
  .chip.ext{background:var(--orange-bg); color:var(--orange); border-left-color:var(--orange);}
  .chip.int{background:var(--blue-bg); color:var(--blue); border-left-color:var(--blue);}
  .chip.done{text-decoration:line-through; opacity:0.55;}

  .section-title{font-size:16px; font-weight:800; margin:28px 0 12px; display:flex; align-items:center; gap:9px; letter-spacing:-.1px;}
  .section-title::before{content:""; width:4px; height:17px; border-radius:2px; background:var(--gold); display:inline-block;}
  .unscheduled{
    background:var(--panel); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); padding:8px 20px 6px;
  }
  .u-item{font-size:13px; padding:9px 0; border-bottom:1px solid var(--border); display:flex; gap:9px; align-items:baseline;}
  .u-item:last-child{border-bottom:none;}
  .u-tag{font-size:10.5px; font-weight:700; padding:1px 8px; border-radius:20px; flex:none;}
  .u-tag.ext{background:var(--orange-bg); color:var(--orange);}
  .u-tag.int{background:var(--blue-bg); color:var(--blue);}
  .u-due{color:var(--sub); flex:none; font-weight:600;}
  .note{color:var(--sub); font-size:11.5px; margin-top:12px; line-height:1.6;}
  @media (max-width:700px){
    header.top{padding:20px 16px 16px;}
    .wrap{padding:0 12px 40px;}
    .cell{min-height:84px; padding:5px 4px;}
    .chip{font-size:9.5px; padding:1px 4px;}
    .nav .ym{min-width:100px; font-size:16px;}
  }
  @media print{
    header.top{background:none; color:#000; padding:0 0 10px;}
    header.top h1{color:#000;} header.top p, .sync-box{display:none;}
    .cal-card,.unscheduled{box-shadow:none;}
  }
</style>
</head>
<body>
<header class="top">
  <div>
    <h1>📅 유통지원팀 일정표</h1>
    <p>구글 시트 연동 · 미팅·일정 월간 보기</p>
  </div>
  <div class="sync-box">
    <span class="sync-dot" id="syncDot"></span>
    <span id="syncLabel">불러오는 중...</span>
    <button id="refreshBtn">🔄 새로고침</button>
  </div>
</header>

<div class="wrap">
  <div class="toolbar">
    <div class="nav">
      <button id="prevBtn">◀ 이전달</button>
      <div class="ym" id="ymLabel"></div>
      <button id="nextBtn">다음달 ▶</button>
      <button id="todayBtn">오늘</button>
    </div>
    <div class="legend">
      <span><span class="dot ext"></span>외부미팅</span>
      <span><span class="dot int"></span>사내미팅</span>
      <span><span class="dot holiday"></span>공휴일</span>
    </div>
  </div>

  <div class="cal-card"><div class="grid" id="calGrid"></div></div>

  <div id="unschedBox" style="display:none;">
    <div class="section-title">🗓 날짜 미정 (수시 / 기간형)</div>
    <div class="unscheduled"><div id="unschedList"></div></div>
    <p class="note">"수시", "~9월"처럼 정확한 날짜가 없는 미팅·회의 건은 달력에 표시가 안 돼서 여기 따로 모아뒀어요.</p>
  </div>

  <p class="note">구글시트 할일 리스트 기준 — "일정" 칸에 시간(또는 "외부")이 적혀있으면 외부미팅(시간 표시), "사내"면 사내미팅, 칸이 비어있고 주인이 박중문·정상문뿐이면 제외, 그 외는 전부 사내미팅으로 표시합니다 (약 15초 주기 갱신). 일정표의 제목은 세부내용을 사용합니다.</p>
</div>

<script>
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSw7F56F3B-YfoUij840qxkG_teouueOdvnHfOnFVEsd0pvjN8A6wt7ZED5YIqvu0ZaqF2-wE564hI3/pub?gid=0&single=true&output=csv";

function parseCSV(text){
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i=0; i<text.length; i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field=""; }
      else if(c === '\r'){ }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=""; }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => !(r.length===1 && r[0].trim()===""));
}

function parseDeadlineJS(text){
  const t = (text||"").trim();
  if(!t || t === "수시") return {type:"adhoc", date:null};
  const monthMatch = t.match(/(\d+)월/);
  if(monthMatch){
    const month = parseInt(monthMatch[1],10);
    const year = new Date().getFullYear();
    const pad = n=>String(n).padStart(2,"0");
    const dayMatch = t.match(/(\d+)일/);
    if(dayMatch){
      const day = parseInt(dayMatch[1],10);
      return {type:"date", date: `${year}-${pad(month)}-${pad(day)}`};
    }
    const lastDay = new Date(year, month, 0).getDate();
    return {type:"monthend", date: `${year}-${pad(month)}-${pad(lastDay)}`};
  }
  return {type:"adhoc", date:null};
}

function splitMulti(str){
  return (str||"").split(/\r?\n|\s+\/\s+/).map(s=>s.trim()).filter(Boolean);
}

// 반영 순서: ① "일정" 칸이 "외부"면 무조건 외부미팅. ② 칸이 비어있고 주인이 박중문/정상문뿐이면 제외
// (우리팀 안에서의 일). ③ 나머지(칸이 비어있어도 다른 사람이 껴있거나, 칸이 "사내"인 경우)는 전부 사내미팅.
const TEAM_ONLY = ["박중문","정상문"];
function isTeamOnly(owners){
  return owners.length>0 && owners.every(o => TEAM_ONLY.includes(o));
}

let MEETINGS = []; // {date, type(date/adhoc/monthend), title, detail, ddText, owners, cls}
let viewYear, viewMonth; // 1-indexed month

// 시트와 무관하게 매주 고정으로 열리는 회의. weekday는 JS Date.getDay() 기준(0=일 ~ 6=토).
const RECURRING = [
  { weekday: 1, time: "08:30", detail: "팀장 주간회의", cls: "int" }
];

// 하루 안에서 시간의 흐름대로 정렬: 완료된 건을 먼저(시간순), 그다음 예정 건(시간순). 시간 없는 건은 각 그룹 끝.
function timeKey(t){
  const m = String(t||"").match(/(\d{1,2})\s*[:시]\s*(\d{0,2})/);
  if(!m) return 9999;
  let h = +m[1]; const mi = +(m[2]||0);
  if(/오후|PM/i.test(t) && h<12) h+=12;
  return h*60+mi;
}
function sortByFlow(items){
  return items.map((m,i)=>[m,i]).sort((a,b)=>
    (b[0].done?1:0)-(a[0].done?1:0) || timeKey(a[0].time)-timeKey(b[0].time) || a[1]-b[1]).map(x=>x[0]);
}

// 2026년 대한민국 공휴일(대체공휴일 포함). 주말에 해당하는 날은 캘린더가 평일만 보여주므로 표시되지 않는다.
const HOLIDAYS = {
  "2026-01-01": "신정",
  "2026-02-16": "설날연휴", "2026-02-17": "설날", "2026-02-18": "설날연휴",
  "2026-03-01": "삼일절", "2026-03-02": "삼일절(대체)",
  "2026-05-05": "어린이날",
  "2026-05-24": "부처님오신날", "2026-05-25": "부처님오신날(대체)",
  "2026-06-06": "현충일",
  "2026-07-17": "제헌절",
  "2026-08-15": "광복절", "2026-08-17": "광복절(대체)",
  "2026-09-24": "추석연휴", "2026-09-25": "추석", "2026-09-26": "추석연휴", "2026-09-27": "추석연휴",
  "2026-10-03": "개천절", "2026-10-05": "개천절(대체)",
  "2026-10-09": "한글날",
  "2026-12-25": "성탄절"
};

function getRecurringForMonth(year, month){
  const daysInMonth = new Date(year, month, 0).getDate();
  const pad = n=>String(n).padStart(2,"0");
  const now = new Date();
  const out = [];
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${year}-${pad(month)}-${pad(d)}`;
    const weekday = new Date(year, month-1, d).getDay();
    RECURRING.forEach(r=>{
      if(r.weekday !== weekday) return;
      const [hh, mm] = r.time.split(":").map(Number);
      const occursAt = new Date(year, month-1, d, hh, mm);
      out.push({
        title: r.detail, detail: r.detail, ddText: r.time, dtype:"date", ddate: dateStr,
        owners: [], depts: [], cls: r.cls, done: occursAt < now, time: r.time
      });
    });
  }
  return out;
}

function buildMeetings(table){
  if(table.length < 2) return [];
  const header = table[0].map(h=>h.trim());
  const idx = name => header.indexOf(name);
  const cTitle=idx("내용"), cDetail=idx("세부내용"), cDue=idx("기한"), cOwner=idx("주인"), cDept=idx("담당부서"), cSched=idx("일정"), cCheck=idx("O / X");
  const out = [];
  for(let r=1;r<table.length;r++){
    const row = table[r];
    const sched = (row[cSched]||"").trim();
    const owners = (row[cOwner]||"").split(",").map(s=>s.trim()).filter(Boolean);
    // "일정" 칸: "사내"=사내, 비어있으면 팀단독 제외 규칙, 그 외 값(대부분 시간, "외부"도 호환용으로 허용)은
    // 전부 외부미팅으로 본다 — "외부"라는 문자 그대로면 시간 표시 없이, 그 외 값이면 시간으로 보여준다.
    let cls, time = "";
    if(sched && sched !== "사내"){
      cls = "ext";
      if(sched !== "외부") time = sched;
    } else if(!sched && isTeamOnly(owners)){
      continue;
    } else {
      cls = "int";
    }
    const title = (row[cTitle]||"").trim();
    const detail = (row[cDetail]||"").trim();
    if(!title && !detail) continue;
    const ddText = (row[cDue]||"").trim();
    const dd = parseDeadlineJS(ddText);
    const depts = splitMulti(row[cDept]);
    const done = !!(row[cCheck]||"").trim();
    out.push({
      title, detail, ddText, dtype:dd.type, ddate:dd.date,
      owners, depts, cls, done, time
    });
  }
  return out;
}

function renderCalendar(){
  const grid = document.getElementById("calGrid");
  document.getElementById("ymLabel").textContent = `${viewYear}년 ${viewMonth}월`;
  const dowNames = ["월","화","수","목","금"];
  let html = dowNames.map(d=>`<div class="dow">${d}</div>`).join("");

  const daysInMonth = new Date(viewYear, viewMonth, 0).getDate();
  const pad = n=>String(n).padStart(2,"0");
  const _n = new Date(); const todayStr = `${_n.getFullYear()}-${pad(_n.getMonth()+1)}-${pad(_n.getDate())}`;

  // 토·일은 회사 휴무라 아예 표시하지 않는다 — 월~금 평일만 5열로 배치.
  const weekdays = [];
  for(let d=1; d<=daysInMonth; d++){
    const wd = new Date(viewYear, viewMonth-1, d).getDay();
    if(wd>=1 && wd<=5) weekdays.push(d);
  }
  const firstWd = weekdays.length ? new Date(viewYear, viewMonth-1, weekdays[0]).getDay() : 1;
  const startWeekday = firstWd - 1; // 월=0 ~ 금=4

  const byDate = {};
  getRecurringForMonth(viewYear, viewMonth).forEach(m=>{
    (byDate[m.ddate] = byDate[m.ddate] || []).push(m);
  });
  MEETINGS.filter(m=>m.dtype==="date").forEach(m=>{
    (byDate[m.ddate] = byDate[m.ddate] || []).push(m);
  });

  for(let i=0;i<startWeekday;i++) html += `<div class="cell pad"></div>`;
  weekdays.forEach(d=>{
    const dateStr = `${viewYear}-${pad(viewMonth)}-${pad(d)}`;
    const items = byDate[dateStr] || [];
    const chips = sortByFlow(items).map(m=>{
      const tip = m.title + (m.detail?' — '+m.detail:'') + (m.owners&&m.owners.length?'\n주인: '+m.owners.join(', '):'');
      return `<div class="chip ${m.cls}${m.done?' done':''}" title="${tip.replace(/"/g,'&quot;')}">${m.done?'✔ ':''}${m.time?`<span class="tm">${m.time}</span> `:''}${m.detail||m.title}</div>`;
    }).join("");
    const holiday = HOLIDAYS[dateStr];
    html += `<div class="cell ${dateStr===todayStr?'today':''}${holiday?' holiday':''}"><div class="daynum"><span class="n">${d}</span>${holiday?` <span class="holiday-name">${holiday}</span>`:''}</div>${chips}</div>`;
  });
  const totalCells = startWeekday + weekdays.length;
  const trailing = (5 - (totalCells % 5)) % 5;
  for(let i=0;i<trailing;i++) html += `<div class="cell pad"></div>`;

  grid.innerHTML = html;

  // "~9월"처럼 월말로 계산되는 monthend 타입은 지난 달이면 이미 지난 일정이므로 제외한다.
  // "수시" 같은 adhoc 타입은 날짜 자체가 없어 지났는지 판단할 수 없으니 그대로 둔다.
  const unsched = MEETINGS.filter(m=>m.dtype!=="date" && !(m.dtype==="monthend" && m.ddate < todayStr));
  const box = document.getElementById("unschedBox");
  if(unsched.length){
    box.style.display = "block";
    document.getElementById("unschedList").innerHTML = unsched.map(m=>`
      <div class="u-item" title="${m.owners&&m.owners.length?('주인: '+m.owners.join(', ')).replace(/"/g,'&quot;'):''}">
        <span class="u-tag ${m.cls}">${m.cls==='ext'?'외부':'사내'}</span>
        <span class="u-due">${m.ddText||'-'}${m.time?' '+m.time:''}</span>
        <span${m.done?' style="text-decoration:line-through;opacity:0.55;"':''}>${m.done?'✔ ':''}${m.title}${m.detail?' — '+m.detail:''}</span>
      </div>`).join("");
  } else {
    box.style.display = "none";
  }
}

async function pollSheet(){
  try{
    const url = SHEET_CSV_URL + (SHEET_CSV_URL.includes("?")?"&":"?") + "t=" + Date.now();
    const res = await fetch(url, {cache:"no-store"});
    const text = await res.text();
    const table = parseCSV(text);
    MEETINGS = buildMeetings(table);
    document.getElementById("syncLabel").textContent = "마지막 갱신: " + new Date().toLocaleTimeString("ko-KR");
    renderCalendar();
  } catch(e){
    document.getElementById("syncLabel").textContent = "동기화 실패 — 잠시 후 재시도";
  }
}

const now = new Date();
viewYear = now.getFullYear();
viewMonth = now.getMonth()+1;

document.getElementById("prevBtn").addEventListener("click", ()=>{
  viewMonth--; if(viewMonth<1){viewMonth=12; viewYear--;}
  renderCalendar();
});
document.getElementById("nextBtn").addEventListener("click", ()=>{
  viewMonth++; if(viewMonth>12){viewMonth=1; viewYear++;}
  renderCalendar();
});
document.getElementById("todayBtn").addEventListener("click", ()=>{
  const n = new Date(); viewYear = n.getFullYear(); viewMonth = n.getMonth()+1;
  renderCalendar();
});
document.getElementById("refreshBtn").addEventListener("click", pollSheet);

pollSheet();
setInterval(pollSheet, 15000);
</script>
</body>
</html>
