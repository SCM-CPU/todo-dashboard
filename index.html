<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>유통지원 PROJECT (공유)</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.css" />
<style>
  /* =====================================================================
     새 디자인(미리보기) — 크기 조절 변수
     화면에 맞게 조정할 때는 아래 숫자만 바꾸세요.
     --fs        : 첫 장면 글자 기준(1em). 값을 키우면 첫 장면 전체가 커집니다.
     --stage-h   : 첫 장면 높이(스크롤 없이 한 화면에 보이는 영역)
     --hdr-h     : 맨 위 파란 헤더 높이(첫 장면 높이 계산용)
     --wrap-max  : 화면 가로 최대 폭
     --rail-w    : 오른쪽 어두운 '오늘 할일' 패널 폭
     --rail-list-h : 오른쪽 패널 안 목록 최대 높이
     ===================================================================== */
  :root{
    --fs: clamp(12px, 0.42vw + 7.2px, 21px);
    --hdr-h: 118px;
    --stage-h: clamp(520px, calc(100vh - var(--hdr-h) - 16px), 1500px);
    --wrap-max: min(96vw, 2300px);
    --rail-w: 34%;
    --rail-list-h: 24vh;

    --live:#2bd67b;
    --c-baekje:#0E8A5F; --c-boksan:#2F63F2; --c-incheon:#D4570C;
    --dark1:#0b1120; --dark2:#1b2647;
  }
  :root{
    --bg:#ffffff; --panel:#ffffff; --text:#14161f; --sub:#646b7a; --border:#d3d7e3;
    --blue:#243e8f; --blue-bg:#eaeef9; --orange:#a45414; --orange-bg:#f8ede0;
    --green:#166b45; --green-bg:#e6f3ec; --amber:#96690a; --amber-bg:#f7eede;
    --red:#a3241c; --red-bg:#f7e6e4; --purple:#5a3d94; --purple-bg:#ece7f6;
    --hover:#eef0f6; --shadow: 0 1px 2px rgba(15,23,42,.09), 0 8px 22px rgba(15,23,42,.12);
    --navy-from:#0b1120; --navy-to:#1b2647; --gold:#c9a24b; --gold-bg:#f8f0dc;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0d0f16; --panel:#161a26; --text:#eef0f6; --sub:#9aa1b3; --border:#262b3b;
      --blue:#7d9cf2; --blue-bg:#1b2742; --orange:#e2a568; --orange-bg:#332212;
      --green:#5fcf9a; --green-bg:#12291f; --amber:#e3bd6b; --amber-bg:#332811;
      --red:#e58079; --red-bg:#37191a; --purple:#bda5ec; --purple-bg:#251d3d;
      --hover:#1e2333; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
      --navy-from:#05070d; --navy-to:#141c33; --gold:#d9bb72; --gold-bg:#332811;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0d0f16; --panel:#161a26; --text:#eef0f6; --sub:#9aa1b3; --border:#262b3b;
    --blue:#7d9cf2; --blue-bg:#1b2742; --orange:#e2a568; --orange-bg:#332212;
    --green:#5fcf9a; --green-bg:#12291f; --amber:#e3bd6b; --amber-bg:#332811;
    --red:#e58079; --red-bg:#37191a; --purple:#bda5ec; --purple-bg:#251d3d;
    --hover:#1e2333; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
    --navy-from:#05070d; --navy-to:#141c33; --gold:#d9bb72; --gold-bg:#332811;
  }
  :root[data-theme="light"]{
    --bg:#ffffff; --panel:#ffffff; --text:#14161f; --sub:#646b7a; --border:#d3d7e3;
    --blue:#243e8f; --blue-bg:#eaeef9; --orange:#a45414; --orange-bg:#f8ede0;
    --green:#166b45; --green-bg:#e6f3ec; --amber:#96690a; --amber-bg:#f7eede;
    --red:#a3241c; --red-bg:#f7e6e4; --purple:#5a3d94; --purple-bg:#ece7f6;
    --hover:#eef0f6; --shadow: 0 1px 2px rgba(15,23,42,.09), 0 8px 22px rgba(15,23,42,.12);
    --navy-from:#0b1120; --navy-to:#1b2647; --gold:#c9a24b; --gold-bg:#f8f0dc;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,sans-serif;
    line-height:1.5; overflow-x:hidden;
  }
  .wrap{max-width:1180px; margin:0 auto; padding:0 20px 60px;}
  header.top{
    margin:0 0 26px; display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap;
    position:relative; left:50%; width:100vw; margin-left:-50vw;
    background:linear-gradient(135deg, var(--navy-from), var(--navy-to));
    padding:26px max(20px, calc((100vw - 1180px)/2 + 20px)) 22px;
  }
  header.top h1{font-size:21px; margin:0 0 5px; letter-spacing:-.2px; font-weight:800; color:#fdfdff;}
  header.top p{margin:0; color:rgba(255,255,255,.58); font-size:13px; letter-spacing:.1px;}
  .sync-box{display:flex; align-items:center; gap:8px; font-size:12px; color:rgba(255,255,255,.8); background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.14); border-radius:20px; padding:6px 8px 6px 12px; backdrop-filter:blur(6px);}
  .sync-dot{width:7px; height:7px; border-radius:50%; background:var(--gold); flex-shrink:0;}
  .sync-dot.flash{animation:pulse .9s ease;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(201,162,75,.55);}70%{box-shadow:0 0 0 8px rgba(201,162,75,0);}100%{box-shadow:0 0 0 0 rgba(201,162,75,0);}}
  .sync-box button{border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.06); color:#fff; cursor:pointer; font-size:12px; font-weight:600; padding:5px 11px; border-radius:20px; text-decoration:none; transition:background .12s;}
  .sync-box button:hover{background:rgba(255,255,255,.18);}
  #syncNowBtn{border:none; background:none; padding:0; font-weight:400; color:var(--gold); text-decoration:underline;}
  #syncNowBtn:hover{background:none;}

  .kpi-panel{display:grid; grid-template-columns:repeat(6,1fr); gap:14px; margin-bottom:22px;}
  .kpi-panel .kpi-card{grid-column:span 2;}
  .kpi-panel .kpi-card.kpi-direct, .kpi-panel .kpi-card.kpi-vc{grid-column:span 3;}
  .kpi-card{
    background:var(--panel);
    border:1px solid var(--border); border-radius:14px; padding:18px 20px; box-shadow:var(--shadow);
    position:relative; overflow:hidden; transition:transform .15s ease, box-shadow .15s ease;
  }
  .kpi-card:hover{transform:translateY(-2px); box-shadow:0 4px 10px rgba(15,23,42,.07), 0 16px 34px rgba(15,23,42,.11);}
  .kpi-card::before{content:""; position:absolute; top:0; left:18px; right:18px; height:2px; border-radius:0 0 3px 3px; background:var(--blue); opacity:.85;}
  .kpi-watermark{position:absolute; right:6px; bottom:0px; font-size:72px; line-height:1; opacity:.05; transform:rotate(-6deg); pointer-events:none; filter:grayscale(1);}
  a.kpi-label-link{color:inherit; text-decoration:underline; text-underline-offset:2px; cursor:pointer;}
  a.kpi-label-link:hover{color:var(--blue);}
  .kpi-card.kpi-vc::before{background:var(--purple);}
  .kpi-card.kpi-svc::before{background:var(--gold);}
  .kpi-head{display:flex; align-items:center; gap:9px; margin-bottom:10px; position:relative;}
  .kpi-icon{font-size:15px; width:30px; height:30px; flex-shrink:0; display:inline-flex; align-items:center; justify-content:center; border-radius:9px; background:var(--hover); box-shadow:inset 0 0 0 1px var(--border);}
  .kpi-card.kpi-vc .kpi-icon{background:var(--purple-bg);}
  .kpi-card.kpi-svc .kpi-icon{background:var(--amber-bg);}
  .kpi-label{font-size:15px; font-weight:800; color:var(--text); letter-spacing:-.1px;}
  .kpi-value{font-size:27px; font-weight:800; margin-bottom:2px; letter-spacing:-.02em; font-variant-numeric:tabular-nums; color:color-mix(in srgb, var(--blue) 20%, var(--text)); position:relative; line-height:1.3; min-height:70px;}
  .kpi-card.kpi-vc .kpi-value{color:color-mix(in srgb, var(--purple) 24%, var(--text));}
  .kpi-card.kpi-svc .kpi-value{color:color-mix(in srgb, var(--gold) 34%, var(--text));}
  .kpi-target{display:block; font-size:12.5px; font-weight:600; color:var(--sub); margin-bottom:8px; position:relative; min-height:18px;}
  .kpi-bar{height:6px; border-radius:5px; background:var(--hover); overflow:hidden; margin:8px 0 7px; position:relative;}
  .kpi-bar .fill{height:100%; border-radius:5px; background:linear-gradient(90deg, var(--blue), color-mix(in srgb, var(--blue) 60%, #fff));}
  .kpi-vc .kpi-bar .fill{background:linear-gradient(90deg, var(--purple), color-mix(in srgb, var(--purple) 60%, #fff));}
  .kpi-svc .kpi-bar .fill{background:linear-gradient(90deg, var(--gold), color-mix(in srgb, var(--gold) 60%, #fff));}
  .kpi-sub{font-size:11.5px; color:var(--sub); position:relative;}
  .kpi-achieved{display:inline-block; font-size:10.5px; font-weight:800; color:var(--gold); background:var(--gold-bg); border:1px solid var(--gold); padding:1px 8px; border-radius:20px; margin-left:6px;}
  .kpi-value-note{display:inline-block; font-size:11px; font-weight:600; color:var(--sub); margin-left:6px;}

  .kpi-monthly{margin-top:6px; padding-top:6px; border-top:1px dashed var(--border);}
  .kpi-monthly-base{display:flex; justify-content:space-between; align-items:baseline; font-size:10px; color:var(--sub); font-weight:600; margin-bottom:3px;}
  .kpi-monthly-unit{font-weight:400;}
  .kpi-monthly-table{width:100%; border-collapse:collapse; table-layout:fixed;}
  .kpi-monthly-table th, .kpi-monthly-table td{border:1px solid var(--border); text-align:center; padding:1.5px 0; font-size:9px; line-height:1.3;}
  .kpi-monthly-table th{font-weight:700; color:var(--sub); background:var(--hover);}
  .kpi-monthly-table td{font-weight:700; color:var(--text);}
  .kpi-monthly-table th:first-child, .kpi-monthly-table td:first-child{width:30px; font-weight:700; color:var(--sub); background:var(--hover); white-space:nowrap;}
  .kpi-monthly-table td{white-space:nowrap;}
  .kpi-monthly-table td.empty{color:var(--sub); opacity:.35; font-weight:400;}

  .kpi-sla{margin-top:6px; padding-top:6px; border-top:1px dashed var(--border);}
  .kpi-sla-title{font-size:10px; color:var(--sub); font-weight:600; margin-bottom:3px;}
  .kpi-sla-table{width:100%; border-collapse:collapse;}
  .kpi-sla-table td{border:1px solid var(--border); padding:2px 6px; font-size:10px;}
  .kpi-sla-table td:first-child{width:56px; font-weight:700; color:var(--sub); background:var(--hover); white-space:nowrap;}
  .kpi-sla-table td:first-child a{color:inherit; text-decoration:underline; text-underline-offset:2px; cursor:pointer;}
  .kpi-sla-table td:first-child a:hover{color:var(--blue);}
  .kpi-sla-table td:last-child{font-weight:700; color:var(--text); cursor:help;}
  .kpi-trend{margin-top:8px;}
  .kpi-trend .kpi-monthly-table th:first-child, .kpi-trend .kpi-monthly-table td:first-child{width:74px; text-align:left; padding-left:5px;}
  .kpi-trend .kpi-monthly-table td{cursor:help;}
  .kpi-trend-note{font-size:9px; color:var(--sub); margin-top:3px;}

  .section-title{font-size:18px; font-weight:800; margin:26px 0 14px; display:flex; align-items:center; gap:9px; letter-spacing:-.1px; color:var(--text);}
  .section-title::before{content:""; width:4px; height:19px; border-radius:2px; background:var(--gold); display:inline-block;}

  .gap-panel{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:20px;}
  .gap-list{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:7px;}
  .gap-item{font-size:12.5px; line-height:1.45; display:flex; gap:7px; align-items:flex-start;}
  .gap-item::before{content:"▸"; color:var(--sub); flex-shrink:0;}
  .gap-impact{display:inline-block; font-size:10.5px; font-weight:700; color:var(--green); background:var(--green-bg); padding:1px 7px; border-radius:20px; margin-right:5px; white-space:nowrap; flex-shrink:0;}
  .gap-total{margin-top:10px; padding-top:8px; border-top:1px dashed var(--border); font-size:12px; color:var(--sub); text-align:right;}
  .gap-total b{color:var(--text); font-size:13.5px;}

  .today-panel{background:linear-gradient(135deg, var(--red-bg), var(--orange-bg)); border:1px solid var(--border); border-radius:12px; padding:16px 18px; margin-bottom:20px; box-shadow:var(--shadow);}
  .today-panel.week-panel{background:linear-gradient(135deg, var(--blue-bg), var(--purple-bg));}
  .today-panel.added-panel{background:linear-gradient(135deg, var(--green-bg), var(--blue-bg));}
  .today-panel h2{margin:0 0 10px; font-size:14.5px; display:flex; align-items:center; gap:6px;}
  .today-panel h2 .cnt{font-size:12px; font-weight:600; color:var(--sub); background:var(--panel); padding:2px 9px; border-radius:20px;}
  .today-list{display:flex; flex-direction:column; gap:6px;}
  .today-item{display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--border); border-radius:9px; padding:8px 12px; font-size:13px;}
  .today-item .cat-tag{font-size:11px; font-weight:600; color:var(--sub); white-space:nowrap;}
  .today-item .tt{font-weight:600; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .today-item .tt .d{color:var(--sub); font-weight:500;}
  .today-item .owners{font-size:11.5px; color:var(--sub); white-space:nowrap;}
  .today-empty{font-size:13px; color:var(--sub); background:var(--panel); border-radius:9px; padding:10px 12px; text-align:center;}

  .stats{display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-bottom:20px;}
  .stat{background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:16px; box-shadow:var(--shadow);}
  .stat .num{font-size:24px; font-weight:700;}
  .stat .lbl{font-size:12.5px; color:var(--sub); margin-top:2px;}
  .stat.warn .num{color:var(--red);}

  .controls{background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:20px; box-shadow:var(--shadow); display:flex; flex-wrap:wrap; gap:10px; align-items:center; position:sticky; top:10px; z-index:50;}
  .controls input[type=text]{flex:1; min-width:180px; padding:9px 12px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:13.5px;}
  .controls select{padding:9px 10px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:13.5px;}
  .controls label.chk{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--sub); cursor:pointer; white-space:nowrap;}
  .controls .count{margin-left:auto; font-size:12.5px; color:var(--sub);}
  .controls button{padding:9px 14px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); cursor:pointer; font-size:13px;}
  .controls button:hover{background:var(--hover);}

  .month-summary{background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:16px 18px; margin-bottom:20px; box-shadow:var(--shadow); border-top:3px solid var(--blue);}
  .ms-head{font-size:15px; font-weight:800; margin-bottom:12px;}
  .ms-total{font-size:12px; font-weight:700; color:var(--sub); margin-left:6px;}
  .ms-body{column-count:3; column-gap:20px;}
  .ms-cat{break-inside:avoid; margin-bottom:12px;}
  .ms-cat-head{font-size:12.5px; font-weight:700; color:var(--sub); margin-bottom:4px; display:flex; align-items:center; gap:5px;}
  .ms-cat-count{font-size:10.5px; font-weight:700; color:var(--blue); background:var(--hover); border-radius:10px; padding:0 6px;}
  .ms-topic{margin:0 0 8px; font-size:12.5px; color:var(--text);}
  .ms-topic:last-child{margin-bottom:0;}
  .ms-topic-list{margin:2px 0 0; padding-left:16px; line-height:1.55;}
  .ms-topic-list li{margin-bottom:1px;}
  @media (max-width:900px){ .ms-body{column-count:1;} }
  .catnav{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px;}
  .catnav a{font-size:12.3px; padding:6px 12px; border-radius:20px; background:var(--panel); border:1px solid var(--border); color:var(--text); text-decoration:none; display:flex; align-items:center; gap:5px; box-shadow:var(--shadow);}
  .catnav a:hover{background:var(--hover);}
  .catnav a .cnt{color:var(--sub); font-weight:600;}

  .category{background:var(--panel); border:1px solid var(--border); border-radius:14px; margin-bottom:16px; box-shadow:var(--shadow); overflow:hidden; scroll-margin-top:16px;}
  .cat-head{padding:16px 20px; display:flex; align-items:center; gap:12px; cursor:pointer; user-select:none;}
  .cat-head .icon{font-size:15px; width:32px; height:32px; flex-shrink:0; display:inline-flex; align-items:center; justify-content:center; border-radius:9px; background:var(--hover);}
  .cat-head .title{font-size:14.5px; font-weight:700; flex:0 0 auto; letter-spacing:-.1px;}
  .cat-head .depts{display:flex; gap:5px; flex-wrap:wrap;}
  .dept-pill{font-size:10.5px; font-weight:700; padding:2px 9px; border-radius:20px; background:transparent; border:1px solid var(--border); color:var(--sub); white-space:nowrap;}
  .cat-head .spacer{flex:1;}
  .cat-head .progress-wrap{display:flex; align-items:center; gap:8px; min-width:180px;}
  .progress-bar{width:120px; height:6px; border-radius:6px; background:var(--hover); overflow:hidden;}
  .progress-bar .fill{height:100%; background:var(--green); border-radius:6px;}
  .progress-txt{font-size:12.3px; color:var(--sub); white-space:nowrap; font-weight:600;}
  .cat-head .chev{font-size:12px; color:var(--sub); transition:transform .15s;}
  .category.collapsed .chev{transform:rotate(-90deg);}
  .category.collapsed .cat-body{display:none;}

  .cat-body{border-top:1px solid var(--border);}
  table{width:100%; border-collapse:collapse;}
  thead th{text-align:center; font-size:10.5px; color:var(--sub); font-weight:700; padding:9px 14px; background:var(--hover); white-space:nowrap; text-transform:uppercase; letter-spacing:.04em;}
  tbody td{padding:10px 14px; font-size:13.2px; border-top:1px solid var(--border); vertical-align:top;}
  tbody tr:hover{background:var(--hover);}
  tbody tr.done{opacity:.6;}
  tbody tr.done .task-title{text-decoration:line-through;}
  .task-title{font-weight:600; margin-bottom:2px;}
  .task-detail{color:var(--sub); font-size:12.5px;}
  .attach-list{display:flex; flex-wrap:wrap; gap:5px;}
  .attach-btn{display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; padding:4px 10px; border-radius:20px; text-decoration:none; white-space:nowrap; vertical-align:middle; border:1px solid transparent;}
  .attach-btn:hover{filter:brightness(.94);}
  .attach-btn.attach-url{background:var(--green-bg); color:var(--green); border-color:var(--green);}
  .attach-btn.attach-file{background:var(--blue-bg); color:var(--blue); border-color:var(--blue);}
  .owner-pill{display:inline-block; font-size:11px; font-weight:600; padding:2px 8px; border-radius:20px; background:var(--purple-bg); color:var(--purple); margin:1px 3px 1px 0; white-space:nowrap;}
  .status-icon{font-size:16px;}
  .badge{display:inline-block; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:20px; white-space:nowrap;}
  .badge-overdue{background:var(--red-bg); color:var(--red);}
  .badge-today{background:var(--orange-bg); color:var(--orange);}
  .badge-soon{background:var(--amber-bg); color:var(--amber);}
  .badge-monthend{background:var(--blue-bg); color:var(--blue);}
  .badge-adhoc{background:var(--hover); color:var(--sub);}
  .badge-done{background:var(--green-bg); color:var(--green);}
  .result-txt{color:var(--sub); font-size:12px; white-space:pre-line;}
  .empty{text-align:center; padding:40px; color:var(--sub); font-size:13.5px;}
  footer{text-align:center; color:var(--sub); font-size:12px; margin-top:24px;}

  .scroll-top-btn{position:fixed; right:24px; bottom:24px; width:46px; height:46px; border-radius:50%; background:linear-gradient(135deg, var(--navy-from), var(--navy-to)); color:#fff; border:none; font-size:20px; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,.3); display:none; align-items:center; justify-content:center; z-index:500;}
  .scroll-top-btn.show{display:flex;}
  .scroll-top-btn:hover{filter:brightness(1.08);}
  @media print{ .scroll-top-btn{display:none !important;} }

  @media screen and (max-width: 860px){
    .kpi-panel{grid-template-columns:1fr;}
    .kpi-panel .kpi-card, .kpi-panel .kpi-card.kpi-direct, .kpi-panel .kpi-card.kpi-vc{grid-column:auto;}
    .gap-panel{grid-template-columns:1fr;}
    .stats{grid-template-columns:repeat(2,1fr);}
    .cat-head{flex-wrap:wrap;}
    .cat-head .progress-wrap{min-width:0; width:100%; order:5;}
    table thead{display:none;}
    table, tbody, tr, td{display:block; width:100%;}
    tbody tr{border-bottom:1px solid var(--border); padding:10px 14px;}
    tbody td{border:none; padding:3px 0; display:flex; gap:8px;}
    tbody td::before{content:attr(data-label); font-size:11px; color:var(--sub); min-width:60px; font-weight:600; flex-shrink:0;}
  }
  /* ---- 인쇄/PDF: 화면과 같은 레이아웃을 압축된 밀도로 출력 (페이지 수 절약) ---- */
  @media print{
    :root{
      --bg:#f5f7fb; --panel:#ffffff; --text:#1a1d29; --sub:#5b6272; --border:#d7dbe6;
      --blue:#243e8f; --blue-bg:#eaeef9; --orange:#a45414; --orange-bg:#f8ede0;
      --green:#166b45; --green-bg:#e6f3ec; --amber:#96690a; --amber-bg:#f7eede;
      --red:#a3241c; --red-bg:#f7e6e4; --purple:#5a3d94; --purple-bg:#ece7f6;
      --hover:#f0f3fa; --shadow:none;
    }
    *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
    body{background:#fff; font-size:9px;}
    .wrap{max-width:100%; padding:4mm 0 0;}
    .sync-box, .controls, .catnav, footer{display:none !important;}
    .today-item, .stat{break-inside:avoid;}
    .cat-body tr{break-inside:avoid;}
    .category.collapsed .cat-body{display:block !important;}
    .cat-head{cursor:default;}
    @page{ margin:10mm 9mm; }

    /* 밀도 압축: 여백/폰트/장식을 줄여 페이지 수를 절약 */
    header.top{position:static; left:auto; width:auto; margin:0 0 8px; padding:0; background:none !important;}
    header.top h1{font-size:15px; color:var(--text) !important;}
    header.top p{font-size:9.5px; color:var(--sub) !important;}

    .section-title{font-size:10.5px; margin-bottom:5px;}

    .kpi-panel{gap:6px; margin-bottom:8px;}
    .kpi-card{padding:7px 10px; border-radius:6px; border-top-width:2px;}
    .kpi-head{margin-bottom:3px; gap:4px;}
    .kpi-icon{font-size:11px;}
    .kpi-label{font-size:8.5px;}
    .kpi-value{font-size:14px; margin-bottom:0;}
    .kpi-target{font-size:8.5px; margin-bottom:3px;}
    .kpi-bar{height:4px; margin:4px 0 4px;}
    .kpi-sub{font-size:7.5px;}
    .kpi-achieved{font-size:7px; padding:0 5px;}
    .kpi-value-note{font-size:7px; margin-left:3px;}
    .kpi-monthly{margin-top:3px; padding-top:4px;}
    .kpi-monthly-base{font-size:6.5px; margin-bottom:2px;}
    .kpi-monthly-table th, .kpi-monthly-table td{font-size:5.5px; padding:1px 0;}
    .kpi-sla{margin-top:3px; padding-top:4px;}
    .kpi-sla-title{font-size:6.5px; margin-bottom:2px;}
    .kpi-sla-table td{font-size:5.5px; padding:1px 3px;}
    .kpi-sla-table td:first-child{width:36px;}

    .gap-panel{gap:6px; margin-bottom:8px;}
    .gap-list{gap:3px;}
    .gap-item{font-size:8px; gap:4px;}
    .gap-impact{font-size:7px; padding:0 5px;}
    .gap-total{margin-top:5px; padding-top:4px; font-size:7.5px;}
    .gap-total b{font-size:8.5px;}

    .today-panel{padding:7px 10px; margin-bottom:8px; border-radius:6px;}
    .today-panel h2{font-size:10.5px; margin-bottom:5px;}
    .today-item{padding:3px 8px; border-radius:5px; font-size:9px; gap:6px;}

    .stats{gap:6px; margin-bottom:10px;}
    .stat{padding:7px 10px; border-radius:6px;}
    .stat .num{font-size:14px;}
    .stat .lbl{font-size:8.5px;}

    .category{border-radius:6px; margin-bottom:6px;}
    .cat-head{padding:5px 9px; gap:7px;}
    .cat-head .icon{font-size:11px;}
    .cat-head .title{font-size:10.5px;}
    .dept-pill{font-size:7.5px; padding:1px 6px;}
    .progress-bar{width:70px; height:5px;}
    .progress-txt{font-size:8.5px;}

    thead th{font-size:8px; padding:3px 8px;}
    tbody td{font-size:9px; padding:3px 8px;}
    .task-title{margin-bottom:0;}
    .task-detail{font-size:8.5px;}
    .attach-list{gap:3px;}
    .attach-btn{background:none !important; color:var(--sub) !important; padding:0; font-size:8px;}
    .owner-pill{font-size:8px; padding:1px 5px; margin:0 2px 0 0; background:none !important; color:var(--sub) !important;}
    .owner-pill::after{content:", "; color:var(--sub);}
    .owner-pill:last-child::after{content:"";}
    .badge{font-size:8.5px; padding:1px 6px; font-weight:600;}
    .result-txt{font-size:8px;}
    .status-icon{font-size:10px;}
  }

  /* =====================================================================
     새 디자인 레이어 (기존 CSS 위에 덮어씀) — 첫 장면: 세 기둥 + 오늘 패널
     ===================================================================== */
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(43,214,123,.6);}70%{box-shadow:0 0 0 9px rgba(43,214,123,0);}100%{box-shadow:0 0 0 0 rgba(43,214,123,0);}}
  @keyframes live{0%,100%{box-shadow:0 0 0 0 rgba(43,214,123,.5);}50%{box-shadow:0 0 0 6px rgba(43,214,123,0);}}
  @keyframes blink{0%,100%{opacity:1; transform:scale(1);}50%{opacity:.35; transform:scale(.75);}}
  @keyframes rise{from{opacity:0; transform:translateY(.8em);}to{opacity:1; transform:none;}}
  @keyframes grow{from{transform:scaleY(0);}to{transform:scaleY(1);}}
  @keyframes fillx{from{transform:scaleX(0);}to{transform:scaleX(1);}}

  .stage .kpi-panel{display:flex; flex-direction:column; gap:.9em; margin:0;}

  @media screen{
    .wrap{max-width:var(--wrap-max);}
    header.top{
      padding:22px max(20px, calc((100vw - var(--wrap-max))/2 + 20px)) 18px; margin-bottom:16px;
    }
    .sync-dot{background:var(--live); animation:live 2.4s ease-in-out infinite;}
    .sync-dot.flash{animation:pulse .9s ease, live 2.4s ease-in-out .9s infinite;}
    #syncNowBtn{color:#9fe8c1;}

    /* ---- 첫 장면 격자 ---- */
    .stage{
      display:grid; grid-template-columns:minmax(0,1fr) var(--rail-w); gap:1em;
      min-height:var(--stage-h); font-size:var(--fs); margin-bottom:1.6em;
    }

    /* ---- 기둥 ---- */
    .pillar{
      --accent:var(--blue); --accent-l:#8fa8f5;
      position:relative; flex:1 1 0; min-height:min-content;
      background:var(--panel); border:1px solid var(--border); border-radius:.9em; box-shadow:var(--shadow);
      padding:.85em 1.1em .95em 1.35em; display:flex; flex-direction:column; gap:.65em;
    }
    .pillar::before{content:""; position:absolute; left:0; top:.9em; bottom:.9em; width:.28em; border-radius:0 .3em .3em 0; background:var(--accent);}
    .pillar.p-vc{--accent:var(--purple); --accent-l:#c9b4f2;}
    .pillar.p-svc{--accent:var(--gold); --accent-l:#e6cd8c;}
    .p-head{display:flex; align-items:center; gap:.6em;}
    .p-head .kpi-icon{font-size:1em; width:2em; height:2em; border-radius:.6em;}
    .p-head .kpi-label{font-size:1.3em;}
    .p-toggle{
      margin-left:auto; border:1px solid var(--border); background:var(--hover); color:var(--sub);
      border-radius:2em; padding:.2em .85em; font:inherit; font-size:.8em; font-weight:700; cursor:pointer;
    }
    .p-toggle:hover{background:var(--blue-bg); color:var(--text);}
    .p-toggle::after{content:" ▾";}
    .p-toggle[aria-expanded="true"]::after{content:" ▴";}

    .p-body{display:grid; grid-template-columns:minmax(13em,.78fr) minmax(0,1.7fr); gap:1.1em; flex:1; min-height:0; align-items:stretch;}

    /* ---- 어두운 핵심 숫자 칸 ---- */
    .numcell{
      position:relative; overflow:hidden; text-align:left; width:100%; border:0; font:inherit; color:#fff;
      background:linear-gradient(135deg, var(--dark1), var(--dark2)); border-radius:.75em;
      padding:.85em 1.1em; display:flex; flex-direction:column; justify-content:center; gap:.25em;
    }
    button.numcell{cursor:pointer;}
    button.numcell:hover{filter:brightness(1.12);}
    .numcell:focus-visible, .p-toggle:focus-visible, .bw:focus-visible{outline:.15em solid var(--accent-l); outline-offset:.15em;}
    .numcell[aria-expanded="true"]{box-shadow:0 0 0 .16em var(--accent-l);}
    .numcell .nl{font-size:.88em; color:rgba(255,255,255,.7); font-weight:600;}
    .numcell .nv{font-size:3.2em; font-weight:800; line-height:1.05; letter-spacing:-.03em; font-variant-numeric:tabular-nums; display:flex; align-items:baseline; flex-wrap:wrap; gap:.12em;}
    .numcell .nv small{font-size:.38em; font-weight:700; color:rgba(255,255,255,.72); letter-spacing:0;}
    .delta{font-size:.36em; font-weight:800; padding:.15em .6em; border-radius:2em; letter-spacing:0; background:rgba(43,214,123,.18); color:#6df0a8;}
    .delta.dn{background:rgba(255,120,110,.2); color:#ffaaa3;}
    .numcell .ns{font-size:.86em; color:rgba(255,255,255,.78); line-height:1.4;}
    .numcell .ns b{color:#fff;}
    .nbar{height:.42em; border-radius:1em; background:rgba(255,255,255,.14); overflow:hidden; margin-top:.35em;}
    .nbar i{display:block; height:100%; width:var(--w); border-radius:1em; background:linear-gradient(90deg, var(--accent-l), #fff); transform-origin:left;}
    .chip-ok{font-size:.38em; font-weight:800; color:#1b1500; background:#e6cd8c; padding:.15em .7em; border-radius:2em; letter-spacing:0;}

    /* ---- 월별 막대 ---- */
    .p-chart{display:flex; flex-direction:column; min-width:0; min-height:6.5em; cursor:pointer;}
    .chart{display:flex; flex-direction:column; flex:1; min-height:0;}
    .plot{position:relative; flex:1; min-height:5em; border-bottom:1px solid var(--border);}
    .cols{position:absolute; inset:0; display:grid; grid-template-columns:repeat(12,1fr);}
    .bw{position:relative; display:flex; align-items:flex-end; justify-content:center; gap:.12em; outline:none;}
    .bw .bar{display:block; width:62%; height:var(--h); border-radius:.25em .25em 0 0; background:var(--accent); opacity:.5; transform-origin:bottom;}
    .bw.cur .bar{opacity:1; box-shadow:0 0 .8em color-mix(in srgb, var(--accent) 55%, transparent);}
    .bw.future::after{content:""; width:62%; height:.3em; border:1px dashed var(--border); border-radius:.15em;}
    .bw .blink{position:absolute; left:50%; bottom:calc(var(--h) + .35em); margin-left:-.4em; width:.8em; height:.8em; border-radius:50%; background:var(--accent);}
    .bw:hover .bar{opacity:1;}
    .bw[data-tip]:hover::before, .bw[data-tip]:focus-visible::before{
      content:attr(data-tip); position:absolute; bottom:calc(var(--h) + 1.1em); left:50%; transform:translateX(-50%);
      background:#0b1120; color:#fff; font-size:.78em; font-weight:600; line-height:1.4; padding:.35em .7em; border-radius:.5em; white-space:nowrap; z-index:20; pointer-events:none;
      box-shadow:0 .3em 1em rgba(0,0,0,.3);
    }
    .bw:nth-child(-n+2)[data-tip]:hover::before, .bw:nth-child(-n+2)[data-tip]:focus-visible::before{left:0; transform:none;}
    .bw:nth-child(n+10)[data-tip]:hover::before, .bw:nth-child(n+10)[data-tip]:focus-visible::before{left:auto; right:0; transform:none;}
    .goal{position:absolute; left:0; right:0; bottom:var(--b); border-top:.12em dashed var(--red); pointer-events:none;}
    .goal span{position:absolute; right:0; top:-1.45em; font-size:.74em; font-weight:700; color:var(--red); background:var(--panel); padding:0 .3em;}
    .gline{position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none;}
    .gline polyline{fill:none; stroke:var(--orange); stroke-width:2.2; vector-effect:non-scaling-stroke; stroke-linejoin:round; stroke-linecap:round;}
    .axis{display:grid; grid-template-columns:repeat(12,1fr); text-align:center; font-size:.74em; color:var(--sub); margin-top:.25em;}
    .axis span.cur{color:var(--text); font-weight:800;}
    .cnote{font-size:.74em; color:var(--sub); margin-top:.3em; display:flex; flex-wrap:wrap; gap:.3em 1em;}
    .cnote i{display:inline-block; width:.8em; height:.8em; border-radius:.2em; margin-right:.3em; vertical-align:-.1em;}

    /* ---- 펼친 상세 ---- */
    .p-detail, .cell-detail{border-top:1px dashed var(--border); padding-top:.8em; margin-top:.1em;}
    .p-detail{display:none;}
    .pillar.open .p-detail{display:block; animation:rise .3s ease both;}
    .cell-detail[hidden]{display:none;}
    .cell-detail{animation:rise .3s ease both;}
    .chart.big .plot{min-height:10.5em;}
    .subrow{display:grid; grid-template-columns:repeat(12,1fr); text-align:center; font-size:.74em; font-weight:700; margin-top:.2em; color:var(--text);}
    .subrow.lbl{color:var(--sub); font-weight:600;}
    .pair .bar{width:36%; border-radius:.2em .2em 0 0;}
    .pair .bar.b{background:var(--orange); opacity:.7;}
    .stk{display:flex; flex-direction:column-reverse; width:62%; height:var(--h); border-radius:.25em .25em 0 0; overflow:hidden; transform-origin:bottom;}
    .stk i{display:block; width:100%;}
    .p-detail .kpi-monthly, .cell-detail .kpi-sla{border-top:0; margin-top:.8em; padding-top:0;}
    .p-detail .kpi-monthly-base, .cell-detail .kpi-sla-title{font-size:.8em; margin-bottom:.3em;}
    .p-detail .kpi-monthly-table th, .p-detail .kpi-monthly-table td{font-size:.8em; padding:.2em 0;}
    .p-detail .kpi-monthly-table th:first-child, .p-detail .kpi-monthly-table td:first-child{width:3.4em;}
    .cell-detail .kpi-sla-table td{font-size:.86em; padding:.25em .6em;}
    .cell-detail .kpi-sla-table td:first-child{width:5em;}
    .cell-detail .kpi-monthly-table th, .cell-detail .kpi-monthly-table td{font-size:.8em; padding:.2em 0;}
    .cell-detail .kpi-trend .kpi-monthly-table th:first-child, .cell-detail .kpi-trend .kpi-monthly-table td:first-child{width:7.5em;}
    .cell-detail .kpi-trend-note{font-size:.74em;}
    .dlink{display:inline-block; font-size:.8em; font-weight:700; color:var(--blue); margin-bottom:.4em;}

    /* ---- 블록형 서비스 세 칸 ---- */
    .p-cells{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:.8em; flex:1; min-height:0;}
    .p-cells .numcell .nv{font-size:2.3em;}
    .p-cells .numcell{justify-content:flex-start;}

    /* VC 활성화 칸의 품절약 서재 문 (박중문 PC에서 서재가 켜져 있을 때만 열림) */
    .slot-vc-door{margin-left:auto; font-size:.8em; font-weight:600; color:var(--purple); text-decoration:none; white-space:nowrap; border-bottom:1px dashed currentColor;}
    .slot-vc-door:hover{opacity:.7;}
    .slot-vc-door + .p-toggle{margin-left:.6em;}
    @media print{.slot-vc-door{display:none;}}

    /* ---- 오른쪽 어두운 오늘 패널 ---- */
    .rail{
      background:linear-gradient(160deg, var(--dark1), var(--dark2)); color:#eef0f6; border-radius:.9em;
      padding:1em; display:flex; flex-direction:column; gap:.9em; box-shadow:var(--shadow); min-width:0;
    }
    .rail .today-panel{background:none; border:0; box-shadow:none; padding:0; margin:0;}
    .rail .today-panel h2{font-size:1.2em; color:#fff; margin-bottom:.5em;}
    .rail .today-panel h2 .cnt{background:rgba(255,255,255,.16); color:#fff; font-size:.75em;}
    .rail .today-list{max-height:var(--rail-list-h); overflow:auto; gap:.4em;}
    .rail .today-item{background:rgba(255,255,255,.07); border-color:rgba(255,255,255,.13); color:#eef0f6; font-size:.84em; padding:.5em .75em;}
    .rail .today-item .d, .rail .today-item .cat-tag, .rail .today-item .owners{color:rgba(255,255,255,.64);}
    .rail .today-empty{background:rgba(255,255,255,.07); color:rgba(255,255,255,.78); font-size:.84em;}
    .rail .stats{grid-template-columns:repeat(5,1fr); gap:.4em; margin:0;}
    .rail .stat{background:rgba(255,255,255,.07); border-color:rgba(255,255,255,.13); box-shadow:none; padding:.55em .3em; text-align:center; border-radius:.6em;}
    .rail .stat .num{font-size:1.55em; color:#fff !important;}
    .rail .stat .lbl{font-size:.72em; color:rgba(255,255,255,.66);}
    .rail .stat.warn .num{color:#ffb4ae !important;}

    /* ---- 두 번째 장면 이후: 같은 스타일로 정리 ---- */
    .section-title::before{background:var(--blue);}
    .gap-panel{gap:1em;}
    .gap-panel .kpi-card, .category, .month-summary, .controls, .stat{border-radius:.9em;}
    .gap-panel .kpi-card{padding:1.1em 1.3em;}
    .gap-panel .kpi-head .kpi-label{font-size:1.05em;}
    .gap-item{font-size:13px;}
    .cat-head .title{font-size:15px;}

    /* ---- 모바일 ---- */
    @media (max-width:860px){
      .stage{grid-template-columns:1fr; min-height:0; font-size:14px;}
      .rail{order:-1;}
      header.top{padding:16px 14px 14px;}
      .sync-box{flex-wrap:wrap; border-radius:1em; max-width:100%; row-gap:.4em;}
      .sync-box button{white-space:nowrap;}
      .rail .today-list{max-height:30vh;}
      .p-body{grid-template-columns:1fr;}
      .p-cells{grid-template-columns:1fr;}
      .numcell .nv{font-size:2.6em;}
      .p-cells .numcell .nv{font-size:2em;}
      .rail .stats{grid-template-columns:repeat(3,1fr);}
    }
  }

  /* ---- 움직임: 첫 로드와 시트 갱신 때만(.go 클래스를 잠깐 붙임). 줄이기 설정이면 끔 ---- */
  @media screen and (prefers-reduced-motion: no-preference){
    .go .pillar{animation:rise .6s cubic-bezier(.2,.7,.2,1) both;}
    .go .pillar:nth-child(2){animation-delay:.09s;}
    .go .pillar:nth-child(3){animation-delay:.18s;}
    .go .rail{animation:rise .6s .1s cubic-bezier(.2,.7,.2,1) both;}
    .go .bar, .go .stk{animation:grow .9s cubic-bezier(.2,.7,.2,1) both; animation-delay:calc(var(--i, 0) * 45ms + .2s);}
    .go .nbar i{animation:fillx 1.1s .3s ease both;}
    .bw .blink{animation:ring 2.4s ease-out infinite;}
    .bw.cur .bar{animation:glow 3s ease-in-out infinite;}
    .go .bw.cur .bar{animation:grow .9s cubic-bezier(.2,.7,.2,1) both, glow 3s ease-in-out 1.4s infinite; animation-delay:calc(var(--i, 0) * 45ms + .2s), 1.4s;}
  }
  @keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb, var(--accent) 70%, transparent);}70%,100%{box-shadow:0 0 0 .9em transparent;}}
  @keyframes glow{0%,100%{box-shadow:0 0 .6em color-mix(in srgb, var(--accent) 40%, transparent); filter:brightness(1);}50%{box-shadow:0 0 1.6em .15em color-mix(in srgb, var(--accent) 75%, transparent); filter:brightness(1.18);}}
  @media (prefers-reduced-motion: reduce){
    .sync-dot, .sync-dot.flash, .bw .blink{animation:none !important;}
    .p-detail, .cell-detail{animation:none !important;}
  }

  /* ---- 인쇄(PDF): 첫 장면을 한 장에, 애니메이션 끄고 상세는 펼쳐서 ---- */
  @media print{
    *{animation:none !important; transition:none !important;}
    .stage{display:grid; grid-template-columns:2fr 1fr; gap:6px; font-size:8px; min-height:0; height:auto; margin-bottom:8px;}
    .stage .kpi-panel{gap:5px;}
    .pillar{padding:5px 8px 5px 11px; border-radius:5px; gap:3px; break-inside:avoid; border:1px solid var(--border); background:#fff;}
    .pillar::before{width:3px;}
    .p-toggle{display:none;}
    .p-head .kpi-label{font-size:10px;}
    .p-body{display:grid; grid-template-columns:1fr 1.6fr; gap:6px;}
    .numcell{padding:5px 8px; border-radius:5px;}
    .numcell .nv{font-size:20px;}
    .p-cells{display:grid; grid-template-columns:repeat(3,1fr); gap:5px;}
    .p-cells .numcell .nv{font-size:14px;}
    .plot{min-height:36px;}
    .bw .bar{opacity:.85;}
    .bw .blink{display:none;}
    .p-detail{display:block !important; padding-top:3px;}
    .cell-detail, .cell-detail[hidden]{display:block !important; padding-top:3px;}
    .chart.big .plot{min-height:36px;}
    .rail{padding:6px 8px; border-radius:5px; gap:5px; background:#1b2647 !important;}
    .rail .today-panel h2{font-size:10px; margin-bottom:3px;}
    .rail .today-list{max-height:none; overflow:visible;}
    .rail .today-item{font-size:8px; padding:2px 5px;}
    .rail .stat .num{font-size:11px;}
    .rail .stat .lbl{font-size:6.5px;}
    .goal span{background:#fff;}
  }
</style>
</head>

function showFatalError(msg){
  let el = document.getElementById("fatalError");
  if(!el){
    el = document.createElement("div");
    el.id = "fatalError";
    el.style.cssText = "position:fixed;top:0;left:0;right:0;background:#dc2626;color:#fff;padding:12px 16px;font-size:13px;z-index:2000;white-space:pre-wrap;";
    document.body.appendChild(el);
  }
  el.textContent += (el.textContent ? "\n" : "") + msg;
}
window.addEventListener("error", e=>showFatalError("스크립트 오류: " + e.message));
window.addEventListener("unhandledrejection", e=>showFatalError("처리되지 않은 오류: " + (e.reason && e.reason.message ? e.reason.message : e.reason)));

function renderKpiMonthly(k){
  const heads = k.monthly.map(x=>`<th>${x.m}월</th>`).join("");
  const row = (label, field, unit) => `<tr><td>${label}</td>` +
    k.monthly.map(x=>`<td${x[field]==null?' class="empty"':''}>${x[field]!=null?x[field]+unit:'-'}</td>`).join("") + `</tr>`;
  const rows = k.monthlyRows.map(r=>row(r.label,r.field,r.unit!==undefined?r.unit:k.monthlyUnit)).join("");
  return `
    <div class="kpi-monthly">
      <div class="kpi-monthly-base"><span>${k.monthlyBase}</span><span class="kpi-monthly-unit">(단위: 억 원)</span></div>
      <table class="kpi-monthly-table">
        <thead><tr><th>26년</th>${heads}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function renderKpiTrend(t){
  const heads = t.months.map(m=>`<th>${m}</th>`).join("");
  const rows = t.rows.map(r=>`<tr><td title="${r.tip||''}">${r.label}</td>${r.vals.map(v=>v==null?`<td class="empty">-</td>`:`<td>${v.toFixed(1)}</td>`).join("")}</tr>`).join("");
  return `
    <div class="kpi-monthly kpi-trend">
      <div class="kpi-monthly-base"><span>${t.title}</span></div>
      <table class="kpi-monthly-table"><thead><tr><th></th>${heads}</tr></thead><tbody>${rows}</tbody></table>
      <div class="kpi-trend-note">${t.note||''}</div>
    </div>`;
}

function renderKpiSla(k){
  const rows = k.sla.map(s=>{
    const label = s.labelLink ? `<a href="${s.labelLink}"${s.labelLinkBlank?' target="_blank" rel="noopener"':''} title="${s.labelLinkTitle||''}">${s.label}</a>` : s.label;
    return `<tr><td>${label}</td><td title="${s.detail||''}">${s.text}</td></tr>`;
  }).join("");
  return `
    <div class="kpi-sla">
      <div class="kpi-sla-title">${k.slaTitle||"SLA 평가"}</div>
      <table class="kpi-sla-table"><tbody>${rows}</tbody></table>
      ${k.trend?renderKpiTrend(k.trend):''}
    </div>`;
}

function nf(v){ return v==null ? "-" : (Number.isInteger(v) ? String(v) : v.toFixed(1)); }
function numFrom(s){ const m=(s||"").match(/(\d+(?:\.\d+)?)/); return m ? parseFloat(m[1]) : null; }
function lastIdx(monthly, f){ let i=-1; monthly.forEach((x,j)=>{ if(x[f]!=null) i=j; }); return i; }
function stripParen(s){ return (s||"").replace(/^\(|\)$/g,""); }

function kpiLabelHtml(k){
  if(k.linkKey) return `<a class="kpi-label kpi-label-link" data-linkkey="${k.linkKey}" target="_blank" rel="noopener" title="${k.linkTitle||''}">${k.label}</a>`;
  if(k.link) return `<a class="kpi-label kpi-label-link" href="${k.link}"${k.linkBlank?' target="_blank" rel="noopener"':''} title="${k.linkTitle||(k.label+' 바로가기')}">${k.label}</a>`;
  return `<span class="kpi-label">${k.label}</span>`;
}

// 월 막대 차트. kind: direct | vc, big: 펼친 상세용
function monthChart(k, kind, big){
  const m = k.monthly;
  const f = kind==="direct" ? "pharma" : "val";
  const li = lastIdx(m, f);
  const goal = kind==="direct" ? numFrom(k.target) : null;
  const maxV = Math.max(...m.map(x=>x[f]).filter(v=>v!=null));
  const scale = kind==="direct" ? Math.max(goal, maxV)*1.2 : maxV*1.25;
  const cols = m.map((x,i)=>{
    const v = x[f];
    const st = v==null ? "future" : (i===li ? "cur" : "past");
    const h = v==null ? 0 : (v/scale*100).toFixed(1);
    let tip = `${x.m}월 · 아직 없음`, inner = "";
    if(v!=null){
      if(kind==="direct"){
        tip = `${x.m}월 · 제약 ${x.pharma}% · 그룹사 ${x.group}% · 직거래 ${x.revenue}억`;
        if(big){
          const hg = (x.group/scale*100).toFixed(1);
          inner = `<i class="bar" style="--i:${i}"></i><i class="bar b" style="--i:${i};height:${hg}%"></i>`;
        } else inner = `<i class="bar" style="--i:${i}"></i>`;
      } else {
        const has3 = x.baekje!=null;
        tip = `${x.m}월 · ${nf(x.val)}억` + (has3 ? ` (백제 ${x.baekje} · 복산 ${x.boksan} · 인천 ${x.incheon})` : "");
        if(big){
          inner = has3
            ? `<div class="stk" style="--i:${i}"><i style="flex:${x.baekje};background:var(--c-baekje)"></i><i style="flex:${x.boksan};background:var(--c-boksan)"></i><i style="flex:${x.incheon};background:var(--c-incheon)"></i></div>`
            : `<div class="stk" style="--i:${i}"><i style="flex:1;background:#9aa1b3"></i></div>`;
        } else inner = `<i class="bar" style="--i:${i}"></i>`;
      }
    }
    return `<div class="bw ${st}${big&&kind==="direct"?' pair':''}" style="--h:${h}%" data-tip="${tip}" tabindex="0">${inner}${i===li&&!big?'<b class="blink"></b>':''}</div>`;
  }).join("");
  let overlay = "";
  if(kind==="direct"){
    overlay += `<div class="goal" style="--b:${(goal/scale*100).toFixed(1)}%"><span>목표 ${goal}%</span></div>`;
    if(!big){
      const pts = m.map((x,i)=> x.group==null ? null : `${i+0.5},${(100-x.group/scale*100).toFixed(1)}`).filter(Boolean).join(" ");
      overlay += `<svg class="gline" viewBox="0 0 12 100" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}"/></svg>`;
    }
  }
  const axis = m.map((x,i)=>`<span class="${i===li?'cur':''}">${x.m}월</span>`).join("");
  let note = "";
  if(kind==="direct") note = big
    ? `<span><i style="background:var(--blue)"></i>제약 직거래율</span><span><i style="background:var(--orange)"></i>그룹사</span><span>점선: 목표 ${goal}%</span>`
    : `<span><i style="background:var(--blue)"></i>제약 직거래율(막대)</span><span><i style="background:var(--orange)"></i>그룹사(선)</span>`;
  else note = big
    ? `<span><i style="background:var(--c-baekje)"></i>백제</span><span><i style="background:var(--c-boksan)"></i>복산</span><span><i style="background:var(--c-incheon)"></i>인천</span><span><i style="background:#9aa1b3"></i>1~3월은 합계만</span>`
    : `<span>월 매출(억) · 25년 월 10억 → ${k.target}</span>`;
  let sub = "";
  if(big && kind==="direct"){
    sub = `<div class="subrow lbl">직거래 금액(억)</div><div class="subrow">${m.map(x=>`<span>${x.revenue==null?'-':x.revenue}</span>`).join("")}</div>`;
  }
  return `<div class="chart${big?' big':''}"><div class="plot"><div class="cols">${cols}</div>${overlay}</div><div class="axis">${axis}</div>${sub}<div class="cnote">${note}</div></div>`;
}

// 칸 보조 힌트 — SLA 행 데이터에서 계산(없으면 기존 sub 문구)
function svcHint(k){
  const sla = k.sla || [];
  try{
    if(/거점도매/.test(k.label)){
      const mins = sla.map(s=>parseFloat(s.label)).filter(n=>!isNaN(n));
      return `${sla[0].label} ${sla[0].text} · 최저 ${Math.min(...mins)}점`;
    }
    if(/종합도매/.test(k.label)){
      const d = sla.find(s=>s.label==="D");
      if(d){ const sc = (d.text.match(/\d+\.\d/g)||[]).map(parseFloat); return `D ${d.text.split(" · ").length}개사 · 최저 ${Math.min(...sc).toFixed(1)}`; }
    }
    if(/VC도매/.test(k.label)){
      let low = null;
      sla.forEach(s=>{
        const all = [...s.text.matchAll(/(\d+)점\s*([SABCD])/g)];
        if(all.length){ const l = all[all.length-1]; const sc = parseInt(l[1],10); if(!low || sc<low.sc) low = {name:s.label.replace(/약품|나이스/,''), sc, g:l[2]}; }
      });
      if(low) return `최저 ${low.name} ${low.sc}점 ${low.g}`;
    }
  }catch(e){}
  return k.sub || "";
}

function numCellDirectVc(k, kind){
  const m = k.monthly;
  const f = kind==="direct" ? "pharma" : "val";
  const li = lastIdx(m, f);
  const cur = m[li], prev = li>0 ? m[li-1] : null;
  const d = prev && prev[f]!=null ? cur[f]-prev[f] : null;
  const unit = kind==="direct" ? "%" : "억";
  const dTxt = d==null ? "" : `<span class="delta${d<0?' dn':''}">${d<0?'▼':'▲'} ${nf(Math.abs(Math.round(d*10)/10))}${kind==="direct"?'%p':'억'}</span>`;
  const label = kind==="direct" ? `${cur.m}월 제약 직거래율` : `${cur.m}월 VC 매출`;
  const ns = kind==="direct"
    ? `그룹사 <b>${cur.group}%</b> · ${k.target}<br>${stripParen(k.valueNote)}`
    : `${k.target}<br>${stripParen(k.valueNote)}`;
  return `<button type="button" class="numcell" data-toggle="pillar" aria-expanded="false" title="눌러서 상세 보기">
      <span class="nl">${label}</span>
      <span class="nv">${nf(cur[f])}<small>${unit}</small>${dTxt}</span>
      <span class="ns">${ns}</span>
      <span class="nbar"><i style="--w:${Math.min(100,Math.max(0,k.pct))}%"></i></span>
    </button>`;
}

function pillarHtml(k, kind){
  const detailBig = monthChart(k, kind, true) + renderKpiMonthly(k);
  return `
  <section class="pillar p-${kind}" data-pillar="${kind}">
    <div class="p-head"><span class="kpi-icon">${k.icon}</span>${kpiLabelHtml(k)}
      ${kind==="vc" ? '<a class="slot-vc-door" href="http://127.0.0.1:8765/" target="_blank" rel="noopener" title="품절약 서재 (박중문 PC에서 서재가 켜져 있을 때만 열림)">📚 품절약 협조 ▸</a>' : ''}
      <button type="button" class="p-toggle" data-toggle="pillar" aria-expanded="false">상세</button></div>
    <div class="p-body">
      ${numCellDirectVc(k, kind)}
      <div class="p-chart" data-toggle="pillar">${monthChart(k, kind, false)}</div>
    </div>
    <div class="p-detail">${detailBig}</div>
  </section>`;
}

function svcPillarHtml(list){
  const cells = list.map((k,i)=>{
    const big = k.value.replace(/\s*\(.*\)\s*$/,"");
    const small = (k.value.match(/\((.*)\)\s*$/)||[])[1];
    return `<button type="button" class="numcell" data-toggle="cell" data-cell="${i}" aria-expanded="false" title="눌러서 상세 보기">
      <span class="nl">${k.label.replace(/^블록형\s*·\s*/,"")}</span>
      <span class="nv">${big}${k.achieved?'<span class="chip-ok">달성</span>':''}</span>
      <span class="ns">${small?`<b>(${small})</b> · `:''}${svcHint(k)}</span>
      <span class="nbar"><i style="--w:${Math.min(100,Math.max(0,k.pct))}%"></i></span>
    </button>`;
  }).join("");
  const details = list.map((k,i)=>`
    <div class="cell-detail" data-cell="${i}" hidden>
      ${k.link ? `<a class="dlink" href="${k.link}"${k.linkBlank?' target="_blank" rel="noopener"':''} title="${k.linkTitle||''}">${k.label} 열기 ↗</a>` : `<div class="kpi-label" style="font-size:1em">${k.label}</div>`}
      ${renderKpiSla(k)}
    </div>`).join("");
  return `
  <section class="pillar p-svc" data-pillar="svc">
    <div class="p-head"><span class="kpi-icon">⭐</span><span class="kpi-label">블록형 거점 도매 서비스</span></div>
    <div class="p-cells">${cells}</div>
    ${details}
  </section>`;
}

}

// 기둥/칸 눌러서 같은 자리에서 펼침·접힘
document.getElementById("kpiPanel").addEventListener("click", e=>{
  const t = e.target.closest("[data-toggle]");
  if(!t || e.target.closest("a")) return;
  const p = t.closest(".pillar");
  if(t.dataset.toggle==="pillar"){
    const open = !p.classList.contains("open");
    p.classList.toggle("open", open);
    p.querySelectorAll('[data-toggle="pillar"][aria-expanded]').forEach(b=>b.setAttribute("aria-expanded", open));
  } else {
    const was = t.getAttribute("aria-expanded")==="true";
    p.querySelectorAll('[data-toggle="cell"]').forEach(b=>b.setAttribute("aria-expanded","false"));
    p.querySelectorAll(".cell-detail").forEach(d=>d.hidden = true);
    if(!was){
      t.setAttribute("aria-expanded","true");
      p.querySelector(`.cell-detail[data-cell="${t.dataset.cell}"]`).hidden = false;
    }
  }
});

let ROWS = [], CATS = [], DEPTS = [];
let DW_URL = "";  // 대웅물류현황 주소: 구글시트 L열 1행 값
let DIRECT_URL = "";  // 직거래 활성화 주소: 구글시트 M열 1행 값
let LOGISTICS_URL = "";  // 로직스 주소: 구글시트 N열 1행 값
function applyDynamicLinks(){
  document.querySelectorAll('a[data-linkkey="directUrl"]').forEach(a=>{
    if(DIRECT_URL){ a.href = DIRECT_URL; }
    else { a.removeAttribute("href"); a.title = "구글시트 M열 1행에 주소가 없습니다"; }
  });
}
let lastGeneratedAt = null;

function computeRow(r, todayDate){
  const depts = r.depts || [];
  const owners = r.owners || [];
  let statusKey = "adhoc";
  if(r.done){ statusKey = "done"; }
  else if(r.dtype==="date"){
    const d = new Date(r.ddate+"T00:00:00");
    const diffDays = Math.round((d-todayDate)/86400000);
    if(diffDays<0) statusKey="overdue";
    else if(diffDays===0) statusKey="today";
    else if(diffDays<=3) statusKey="soon";
    else statusKey="date";
  } else if(r.dtype==="monthend"){ statusKey="monthend"; }
  return {...r, depts, owners, statusKey};
}

function refreshDeptSelect(){
  const sel = document.getElementById("fDept");
  const cur = sel.value;
  sel.innerHTML = '<option value="">전체 담당부서</option>' + DEPTS.map(d=>`<option value="${d}">${d}</option>`).join("");
  if(DEPTS.includes(cur)) sel.value = cur;
}

function updateSyncLabel(flash){
  const label = document.getElementById("syncLabel");

  if(flash){
    dot.classList.remove("flash"); void dot.offsetWidth; dot.classList.add("flash");

}

function loadData(payload, flash){
  const today = new Date(); today.setHours(0,0,0,0);
  ROWS = (payload.rows||[]).map(r=>computeRow(r, today));
  CATS = [...new Set(ROWS.map(r=>r.cat))];
  DEPTS = [...new Set(ROWS.flatMap(r=>r.depts))];
  lastGeneratedAt = payload.generatedAt;
  DW_URL = payload.dwUrl || "";
  DIRECT_URL = payload.directUrl || "";
  LOGISTICS_URL = payload.logisticsUrl || "";
  const lgBtn = document.getElementById("logisticsBtn");
  lgBtn.title = LOGISTICS_URL ? LOGISTICS_URL : "구글시트 N열 1행에 주소가 없습니다";

  updateSyncLabel(flash);
  if(flash) replayMotion();
  renderTodayPanel();

  trackNewRows(ROWS);
  renderAddedTodayPanel();
  applyFilters();
}

// RFC4180 스타일 CSV 파서 (따옴표로 감싼 셀 안의 줄바꿈/쉼표도 처리)
function parseCSV(text){
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i=0; i<text.length; i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field=""; }
      else if(c === '\r'){ /* skip, \n에서 처리 */ }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=""; }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => !(r.length===1 && r[0].trim()===""));
}

function parseDeadlineJS(text){
  const t = (text||"").trim();
  if(!t || t === "수시") return {type:"adhoc", date:null};
  const monthMatch = t.match(/(\d+)월/);
  if(monthMatch){
    const month = parseInt(monthMatch[1],10);
    const pad = n=>String(n).padStart(2,"0");
    const dayMatch = t.match(/(\d+)일/);
    // 연도: "27년"/"2027년"이 있으면 그대로, 없으면 올해. 단 6개월 넘게 지난 날짜는 내년으로 본다(예: 10월에 입력한 "1월 1일" = 내년)
    const ym = t.match(/(\d{2,4})\s*년/);
    let year = new Date().getFullYear();
    if(ym){ year = parseInt(ym[1],10); if(year < 100) year += 2000; }
    else {
      const cand = new Date(year, month-1, dayMatch ? parseInt(dayMatch[1],10) : 1);
      if(Date.now() - cand.getTime() > 183*86400000) year += 1;
    }
    if(dayMatch){
      const day = parseInt(dayMatch[1],10);
      return {type:"date", date: `${year}-${pad(month)}-${pad(day)}`};
    }
    const lastDay = new Date(year, month, 0).getDate();
    return {type:"monthend", date: `${year}-${pad(month)}-${pad(lastDay)}`};
  }
  return {type:"adhoc", date:null};
}

// 담당부서/첨부파일처럼 한 칸에 여러 값을 넣는 필드는 줄바꿈(Alt+Enter) 또는 " / "로 구분한다.
// (구글시트에 붙여넣기 편의상 " / "로 정리된 경우가 많아 두 방식 다 지원)
function splitMulti(str){
  return (str||"").split(/\r?\n|\s+\/\s+/).map(s=>s.trim()).filter(Boolean);
}

function buildPayloadFromTable(table){
  if(table.length < 2) return {generatedAt: new Date().toLocaleString("ko-KR"), rows: []};
  const header = table[0].map(h=>h.trim());
  const idx = name => header.indexOf(name);
  const cDept=idx("담당부서"), cCat=idx("카테고리"), cKpi=idx("KPI"), cTitle=idx("내용"),
        cDetail=idx("세부내용"), cDue=idx("기한"), cOwner=idx("주인"), cCheck=idx("O / X"),
        cResult=idx("결과"), cAttach=idx("첨부파일");
  const rows = [];
  for(let r=1;r<table.length;r++){
    const row = table[r];
    const cat = (row[cCat]||"").trim();
    const title = (row[cTitle]||"").trim();
    if(!cat && !title) continue;
    const depts = splitMulti(row[cDept]);
    const owners = (row[cOwner]||"").split(",").map(s=>s.trim()).filter(Boolean);
    const ddText = (row[cDue]||"").trim();
    const dd = parseDeadlineJS(ddText);
    const done = (row[cCheck]||"").trim() !== "";
    const result = (row[cResult]||"").replace(/\r\n/g,"\n");
    const attachment = (cAttach>=0 ? (row[cAttach]||"") : "").replace(/\r\n/g,"\n").trim();
    const kpi = (cKpi>=0 ? (row[cKpi]||"") : "").trim();
    rows.push({depts, cat, kpi, title, detail:(row[cDetail]||"").trim(), ddText, dtype:dd.type, ddate:dd.date, owners, done, result, attachment});
  }
  const dwUrl = /^https?:\/\//i.test(header[11]||"") ? header[11] : "";
  const directUrl = /^https?:\/\//i.test(header[12]||"") ? header[12] : "";
  const logisticsUrl = /^https?:\/\//i.test(header[13]||"") ? header[13] : "";
  return {generatedAt: new Date().toLocaleString("ko-KR"), rows, dwUrl, directUrl, logisticsUrl};
}

let lastRawCsv = null;
async function pollSheet(isManual){
  try{
    const url = SHEET_CSV_URL + (SHEET_CSV_URL.includes("?")?"&":"?") + "t=" + Date.now();
    const res = await fetch(url, {cache:"no-store"});
    if(!res.ok) throw new Error("HTTP " + res.status);
    const text = await res.text();
    const changed = text !== lastRawCsv;
    if(!changed && !isManual) return;
    lastRawCsv = text;
    const table = parseCSV(text);
    const payload = buildPayloadFromTable(table);
    loadData(payload, changed || isManual);
  } catch(e){
    document.getElementById("syncLabel").textContent = "동기화 실패 - 잠시 후 재시도";
    if(ROWS.length === 0){
      document.getElementById("catArea").innerHTML = `<div class="empty">구글시트를 불러오지 못했습니다.<br>${e.message}</div>`;
    }
  }
}

function badgeHtml(row){
  if(row.done) return '<span class="badge badge-done">✔ 완료 · '+row.ddText+'</span>';
  switch(row.statusKey){
    case "overdue": return '<span class="badge badge-overdue">⏰ 지연 · '+row.ddText+'</span>';
    case "today": return '<span class="badge badge-today">🔥 오늘마감</span>';
    case "soon": return '<span class="badge badge-soon">⚠ 임박 · '+row.ddText+'</span>';
    case "monthend": return '<span class="badge badge-monthend">🗓 '+row.ddText+'</span>';
    case "adhoc": return '<span class="badge badge-adhoc">🔁 수시</span>';
    default: return '<span class="badge badge-monthend">🗓 '+row.ddText+'</span>';
  }
}

// 첨부파일 칸에 줄바꿈(Alt+Enter)으로 여러 건을 넣을 수 있다.
// 각 줄은 "라벨:URL" 형식이면 라벨이 버튼에 표시된다. (공유용에서는 URL 첨부만 다른 사람이 열 수 있음 - 로컬 파일명은 이 PC에서만 동작)
function parseAttachments(raw){
  if(!raw) return [];
  return splitMulti(raw).map(line=>{
    const idx = line.search(/[:：]/);
    if(idx > 0){
      const before = line.slice(0, idx).trim();
      const after = line.slice(idx+1).trim();
      if(after && !/^https?$/i.test(before)) return { label: before, value: after };
    }
    return { label: null, value: line };
  });
}

function attachHtml(row){
  const items = parseAttachments(row.attachment);
  if(items.length === 0) return '';
  return items.map(item=>{
    const isUrl = /^https?:\/\//i.test(item.value);
    const href = isUrl ? item.value : "첨부파일/" + item.value.split("/").map(encodeURIComponent).join("/");
    const cls = isUrl ? "attach-btn attach-url" : "attach-btn attach-file";
    const icon = isUrl ? "🔗" : "📎";
    const label = item.label || (isUrl ? "바로가기" : "첨부파일");
    return `<a class="${cls}" href="${href}" target="_blank" title="${item.value}" onclick="event.stopPropagation()">${icon} ${label}</a>`;
  }).join("");
}

// "오늘 해야 하는 일"(오늘 마감·지연)과 겹치지 않도록, 이번주 남은 기간(내일~이번주 일요일) 마감 항목만 표시
function renderWeekPanel(){
  const panel = document.getElementById("weekPanel");
  const today = new Date(); today.setHours(0,0,0,0);
  const dow = today.getDay();
  const daysToSunday = dow === 0 ? 0 : 7 - dow;
  const weekEnd = new Date(today);
  weekEnd.setDate(today.getDate() + daysToSunday);
  weekEnd.setHours(23,59,59,999);

  const items = ROWS.filter(r=>{
    if(r.done || r.dtype !== "date") return false;
    const d = new Date(r.ddate + "T00:00:00");
    return d > today && d <= weekEnd;
  }).sort((a,b)=> new Date(a.ddate) - new Date(b.ddate));

  const count = items.length;
  const listHtml = count===0
    ? '<div class="today-empty">이번주 남은 마감 일정이 없습니다.</div>'
    : `<div class="today-list">${items.map(r=>`
        <div class="today-item">
          <span class="cat-tag">${CAT_ICON[r.cat]||"📌"} ${r.cat}</span>
          <span class="tt">${r.title}${r.detail?` <span class="d">· ${r.detail}</span>`:''}</span>
          ${badgeHtml(r)}
          <span class="owners">${r.owners.join(", ")}</span>
        </div>
      `).join("")}</div>`;
  panel.innerHTML = `<h2>🗓 이번주 해야 하는 일 <span class="cnt">${count}건</span></h2>${listHtml}`;
}

// "오늘 추가한 일": 구글시트에 저장된 생성일시가 없어서, 이 브라우저가 마지막으로 확인한 상태와
// 비교해 새로 생긴 행을 감지 → 오늘 날짜로 브라우저에 누적 기록해서 보여준다.
// (이 대시보드가 열려있던 동안 감지된 것만 잡히며, 브라우저별로 별도 기록됨)
function todayStr(){
  const d = new Date(); const p = n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function lsGet(key, fallback){
  try { const v = localStorage.getItem(key); return v===null ? fallback : JSON.parse(v); } catch(e){ return fallback; }
}
function lsSet(key, val){
  try { localStorage.setItem(key, JSON.stringify(val)); } catch(e){}
}

// 스냅샷 자체를 append-only로 저장한다 (키만 저장하면, 구글시트 게시 CSV가 순간적으로
// 캐시된 예전 상태를 줄 때 매 폴링마다 있다/없다가 흔들려서 패널이 깜빡였다).
// 한 번 "오늘 추가됨"으로 확정된 항목은 그날 안에는 다시 사라지지 않는다.
// 새 항목 판단은 카테고리+내용+세부내용 조합(ROW_KEY)이며, 시트 변경이 20초간 없을 때(=입력이
// 끝났을 때)의 상태를 기준으로 확정한다 - 한 행을 나눠서 입력해도 중복으로 안 잡히고,
// 시트 중간에 새 행을 끼워 넣어도(뒤 행들이 밀려도) 내용 기준이라 정상 동작한다.
const ROW_KEY = r => `${r.cat}||${r.title}||${r.detail}`;

if(!lsGet("todoAddedTodaySchemaV3", false)){
  // 이전(순번 기준) 방식 기록은 신뢰할 수 없어 정리하고 새 기준으로 다시 시작
  lsSet("todoAddedTodayList_" + todayStr(), []);
  lsSet("todoAddedTodaySchemaV3", true);
}
let addedTodayList = lsGet("todoAddedTodayList_" + todayStr(), []);
let addedTodayKeys = new Set(addedTodayList.map(it=>it.key));

let addedTodayDebounceTimer = null;
let addedTodayLatestRows = null;

function trackNewRows(rows){
  addedTodayLatestRows = rows;
  if(addedTodayDebounceTimer) clearTimeout(addedTodayDebounceTimer);
  addedTodayDebounceTimer = setTimeout(commitAddedTodaySettle, 20000);
}

function commitAddedTodaySettle(){
  addedTodayDebounceTimer = null;
  const rows = addedTodayLatestRows;
  if(!rows) return;
  const currentKeySet = new Set(rows.map(ROW_KEY));
  const settledKeysRaw = lsGet("todoSettledKeys", null);
  if(settledKeysRaw !== null){
    const settledSet = new Set(settledKeysRaw);
    let changed = false;
    rows.forEach(r=>{
      const k = ROW_KEY(r);
      if(!settledSet.has(k) && !addedTodayKeys.has(k)){
        addedTodayKeys.add(k);
        addedTodayList.push({key:k, cat:r.cat, title:r.title, detail:r.detail});
        changed = true;
      }
    });
    // settle 시점 기준으로 더 이상 존재하지 않는(수정/삭제된) 옛 버전은 정리
    const before = addedTodayList.length;
    addedTodayList = addedTodayList.filter(it => currentKeySet.has(it.key));
    addedTodayKeys = new Set(addedTodayList.map(it=>it.key));
    if(addedTodayList.length !== before) changed = true;
    if(changed) lsSet("todoAddedTodayList_" + todayStr(), addedTodayList);
  }
  lsSet("todoSettledKeys", rows.map(ROW_KEY));
  renderAddedTodayPanel();
}

function renderAddedTodayPanel(){
  const panel = document.getElementById("addedTodayPanel");
  const rowByKey = new Map(ROWS.map(r=>[ROW_KEY(r), r]));
  const items = addedTodayList.map(it => rowByKey.get(it.key) || it).filter(r => !r.done);
  const count = items.length;
  const listHtml = count===0
    ? '<div class="today-empty">오늘 새로 등록된 항목이 아직 없습니다.</div>'
    : `<div class="today-list">${items.map(r=>`
        <div class="today-item">
          <span class="cat-tag">${CAT_ICON[r.cat]||"📌"} ${r.cat}</span>
          <span class="tt">${r.title}${r.detail?` <span class="d">· ${r.detail}</span>`:''}</span>
          ${r.statusKey ? badgeHtml(r) : ''}
          <span class="owners">${(r.owners||[]).join(", ")}</span>
        </div>
      `).join("")}</div>`;
  panel.innerHTML = `<h2>🆕 오늘 추가한 일 <span class="cnt">${count}건</span></h2>${listHtml}`;
}

function renderStats(rows){
  const total = rows.length;
  const done = rows.filter(r=>r.done).length;
  const todo = total-done;
  const overdue = rows.filter(r=>r.statusKey==="overdue").length;
  const rate = total? Math.round(done/total*100):0;
  document.getElementById("stats").innerHTML = `
    <div class="stat"><div class="num">${total}</div><div class="lbl">전체 항목</div></div>
    <div class="stat"><div class="num" style="color:var(--green)">${done}</div><div class="lbl">완료</div></div>
    <div class="stat"><div class="num" style="color:var(--amber)">${todo}</div><div class="lbl">미완료</div></div>
    <div class="stat"><div class="num">${rate}%</div><div class="lbl">완료율</div></div>
    <div class="stat ${overdue>0?'warn':''}"><div class="num">${overdue}</div><div class="lbl">지연 항목</div></div>
  `;
}

function renderCatNav(rows){
  const nav = document.getElementById("catnav");
  nav.innerHTML = CATS.map(cat=>{
    const catRows = rows.filter(r=>r.cat===cat);
    if(catRows.length===0) return "";
    const done = catRows.filter(r=>r.done).length;
    return `<a href="#cat-${slug(cat)}">${CAT_ICON[cat]||"📌"} ${cat} <span class="cnt">${done}/${catRows.length}</span></a>`;
  }).join("");
}

function slug(s){ return s.replace(/[^가-힣a-zA-Z0-9]/g,""); }

function renderCategories(rows){
  const area = document.getElementById("catArea");
  const collapseDone = document.getElementById("fCollapse").checked;
  let html = "";
  CATS.forEach(cat=>{
    const catRows = rows.filter(r=>r.cat===cat);
    if(catRows.length===0) return;
    const done = catRows.filter(r=>r.done).length;
    const total = catRows.length;
    const pct = Math.round(done/total*100);
    const depts = [...new Set(catRows.flatMap(r=>r.depts))];
    const allDone = done===total;
    const collapsed = collapseDone && allDone;
    html += `<div class="category ${collapsed?'collapsed':''}" id="cat-${slug(cat)}">
      <div class="cat-head" onclick="this.parentElement.classList.toggle('collapsed')">
        <span class="icon">${CAT_ICON[cat]||"📌"}</span>
        <span class="title">${cat}</span>
        <span class="depts">${depts.map(d=>`<span class="dept-pill">${d}</span>`).join("")}</span>
        <span class="spacer"></span>
        <span class="progress-wrap">
          <div class="progress-bar"><div class="fill" style="width:${pct}%"></div></div>
          <span class="progress-txt">${done}/${total} (${pct}%)</span>
        </span>
        <span class="chev">▼</span>
      </div>
      <div class="cat-body">
        <table>
          <thead><tr><th style="width:34px"></th><th>내용 / 세부내용</th><th>기한</th><th>담당자</th><th>결과</th><th>첨부파일</th></tr></thead>
          <tbody>
            ${catRows.map(r=>{
              const attach = attachHtml(r);
              return `
              <tr class="${r.done?'done':''}">
                <td data-label="상태"><span class="status-icon">${r.done?'✅':'⬜'}</span></td>
                <td data-label="내용"><div class="task-title">${r.title}</div><div class="task-detail">${r.detail}</div></td>
                <td data-label="기한">${badgeHtml(r)}</td>
                <td data-label="담당자">${r.owners.map(o=>`<span class="owner-pill">${o}</span>`).join("")}</td>
                <td data-label="결과"><span class="result-txt">${r.result||"-"}</span></td>
                <td data-label="첨부파일">${attach ? `<div class="attach-list">${attach}</div>` : '<span class="result-txt">-</span>'}</td>
              </tr>
            `;}).join("")}
          </tbody>
        </table>
      </div>
    </div>`;
  });
  area.innerHTML = html || '<div class="empty">조건에 맞는 항목이 없습니다.</div>';
}

function toDigits(s){ return (s||"").replace(/\D/g,""); }

function applyFilters(){
  const q = document.getElementById("search").value.trim().toLowerCase();
  const qDigits = toDigits(q);
  const dept = document.getElementById("fDept").value;
  const status = document.getElementById("fStatus").value;
  const month = document.getElementById("fMonth").value;

  let rows = ROWS.filter(r=>{
    if(dept && !r.depts.includes(dept)) return false;
    if(status==="done" && !r.done) return false;
    if(status==="todo" && r.done) return false;
    if(status==="overdue" && r.statusKey!=="overdue") return false;
    if(month){
      if(!r.done) return false;
      const mm = r.ddate ? parseInt(r.ddate.slice(5,7),10) : null;
      if(mm !== parseInt(month,10)) return false;
    }
    if(q){
      const hay = [r.title,r.detail,r.result,r.cat,r.ddText,r.ddate,...r.owners,...r.depts].join(" ").toLowerCase();
      const textMatch = hay.includes(q);
      const dateMatch = qDigits.length>=2 && toDigits(r.ddText+" "+(r.ddate||"")).includes(qDigits);
      if(!textMatch && !dateMatch) return false;
    }
    return true;
  });

  renderStats(rows);
  renderCatNav(rows);
  renderCategories(rows);
  renderMonthSummary(month ? rows : null, month);
  document.getElementById("resultCount").textContent = `${rows.length} / ${ROWS.length}건 표시`;
}

function renderMonthSummary(rows, month){
  const el = document.getElementById("monthSummary");
  if(!rows){ el.innerHTML = ""; return; }
  const byCat = {};
  rows.forEach(r=>{
    (byCat[r.cat] = byCat[r.cat] || []).push(r);
  });
  const cats = Object.keys(byCat).map(cat=>{
    const byTitle = {};
    byCat[cat].forEach(r=>{ (byTitle[r.title||cat] = byTitle[r.title||cat] || []).push(r); });
    const topics = Object.keys(byTitle).map(title=>{
      const items = byTitle[title].map(r=>{
        const d = r.detail || r.title;
        return `<li>${r.result ? `${d} — ${r.result}` : d}</li>`;
      }).join("");
      return `<div class="ms-topic"><b>${title}</b><ul class="ms-topic-list">${items}</ul></div>`;
    }).join("");
    return `
    <div class="ms-cat">
      <div class="ms-cat-head">${CAT_ICON[cat]||"•"} ${cat} <span class="ms-cat-count">${byCat[cat].length}</span></div>
      ${topics}
    </div>
  `;
  }).join("");
  el.innerHTML = `
    <div class="month-summary">
      <div class="ms-head">📋 ${month}월 완료 업무 요약 <span class="ms-total">${rows.length}건</span></div>
      <div class="ms-body">${cats}</div>
    </div>
  `;
}
